<html lang="en"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Archivo+Black&family=Noto+Sans+Arabic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#193129;--lime:#b8f200;--bg:#f3f3f3;--paper:#f3f3f3;--ink:#0d0d0d;--olive:#2c5a47;--tan:#e1e1e1;--line:#dcdcdc;--mut:#505050;--bad:#d92d20;--good:#16803c;--warn:#8a5a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:500 16px/1.45 "Archivo","Noto Sans Arabic",Tahoma,sans-serif;background-color:var(--blue);background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:44px 44px;min-height:100vh}
.hv,h1,h2,.big,.sc,.ht,nav button,th{font-family:"Archivo Black","Noto Sans Arabic",Impact,sans-serif;font-weight:900}
.mono{font-family:Consolas,monospace}.lb{font-size:13px;color:var(--mut)}
header{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:12px 18px;background:var(--blue);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:14px;margin:0 8px 0 0;background:#fff;color:#000;border:2px solid var(--lime);border-radius:999px;padding:5px 14px;text-transform:uppercase}
header>.lb:not(#save){display:none}
nav{display:flex;gap:6px;flex-wrap:wrap;width:100%;order:9}
nav button{border:1.5px solid rgba(255,255,255,.75);background:none;color:#fff;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:12.5px}
nav button[aria-current=true]{background:var(--lime);border-color:var(--lime);color:#000}
#save{margin-inline-start:auto;color:#eae4d6;font-size:12px}
header .tb,header select,header input{border:1.5px solid rgba(255,255,255,.75);background:none;color:#fff;padding:6px 14px;border-radius:999px;cursor:pointer;font:600 14px "Archivo","Noto Sans Arabic",sans-serif}
header select option{color:#000}header input{cursor:text}header input::placeholder{color:#eae4d6}
.tb:disabled{opacity:.4;cursor:default}
#hero{max-width:1100px;margin:6px auto 0;padding:6px 18px 18px;color:#fff}
.hw{display:flex;align-items:center;gap:14px}
.ht{font-size:clamp(36px,7.5vw,88px);line-height:.95;text-transform:uppercase;letter-spacing:-.02em;overflow-wrap:anywhere}
.sq{width:clamp(50px,8vw,100px);flex:none}
.gl{display:inline-flex;gap:8px;align-items:baseline;margin-top:12px;padding:8px 16px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px}
.gl b{font:900 20px "Archivo Black",sans-serif}
main{padding:18px;max-width:1100px;margin:0 auto 24px;background:#fff;border-radius:32px}
@media(max-width:700px){main{border-radius:24px;padding:12px;margin-inline:8px}}
section{background:var(--paper);border-radius:22px;padding:16px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.01em}
input,select,textarea{font:inherit;padding:7px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);max-width:100%}
input:disabled{background:#ececec;color:#777}
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);padding:6px 16px;border-radius:999px;cursor:pointer;font:700 14px "Archivo","Noto Sans Arabic",sans-serif}
.btn.pri{background:var(--lime);border-color:var(--lime)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
table{width:100%;border-collapse:collapse}th{text-align:start;padding:6px 8px;border-bottom:2px solid var(--ink);color:var(--ink);font-size:12px;text-transform:uppercase}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
.big{font-size:34px;line-height:1.05}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.stats>div{flex:1 1 140px;padding:14px 16px;background:var(--paper);border-radius:22px}
.stats>div:nth-child(1){background:var(--blue);color:#fff}.stats>div:nth-child(1) .lb{color:#eae4d6}
.stats>div:nth-child(3){background:var(--lime)}.stats>div:nth-child(3) .lb{color:#2c3a00}
.list{max-width:560px}
.li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.li .n{flex:1;min-width:0;font-weight:700}
.pm{width:46px;height:46px;border-radius:50%;border:2px solid #000;font-size:24px;font-weight:900;cursor:pointer;line-height:1}
.plus{background:var(--lime);color:#000}.minus{background:#000;color:#fff}
.sc{min-width:48px;text-align:center;font-size:24px}
.flash{background:color-mix(in srgb,var(--lime) 55%,transparent)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
header button:focus-visible,header select:focus-visible,header input:focus-visible{outline-color:var(--lime)}
a.nm{color:var(--olive);text-decoration:none;cursor:pointer;font-weight:700}
.tg{display:inline-block;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px solid currentColor}
.hi{color:var(--good)}.md{color:var(--warn)}.lo{color:var(--bad)}.mut{color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer}.bar i{display:block;height:18px;background:var(--olive);border-radius:9px}
.al{border-inline-start:6px solid var(--warn);padding:8px 12px;margin-bottom:8px;background:#fff;border-radius:12px}
.al.neg{border-color:var(--bad)}.al.pos{border-color:var(--good)}
.ch{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
svg text{font:11px "Archivo",sans-serif;fill:var(--ink)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--olive)}
.abar{display:flex;gap:8px;align-items:flex-start;background:#fff;border:5px solid #ff1f0f;color:#000;font-weight:600;border-radius:18px;padding:10px 16px;margin:4px 18px 10px}
footer{text-align:center;font-size:12px;color:#eae4d6;padding:0 0 18px}
.lg{display:grid;gap:0 24px}
.qt{flex:1;min-width:200px;background:none;border:0;text-align:start;font:900 15px "Archivo Black","Noto Sans Arabic",sans-serif;color:var(--ink);cursor:pointer;padding:4px 0}
.qt .lb{font:500 13px "Archivo",sans-serif}
.abar.bk{border:3px solid #193129}
#alertbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);width:min(560px,calc(100% - 24px));z-index:50}
#alertbar .abar{margin:0;box-shadow:0 10px 32px rgba(0,0,0,.4)}

try{new Function('a','return a??1;')}catch(e){document.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('app');if(b)b.innerHTML='<section style="padding:16px">This browser is too old for the app. Please update iOS / Safari, or open the link in Chrome.</section>'})}

</head><body>
<header><h1>Workshop Tracker</h1><select id="cls" aria-label="Class"></select><input id="newcls" data-enter="1" placeholder="New class name, then Enter" hidden style="width:210px"><span class="lb">AUTOMOTIVE ELECTRICAL · TRAINING RECORD</span><span id="save" class="lb"></span><button class="tb" id="bkBtn" onclick="bak()" title="Download a backup file">⬇ Backup</button><button class="tb" id="undoAll" disabled title="Undo the last change (Ctrl+Z)">↶ Undo</button><button class="tb" id="lang">عربي</button><nav id="nav"></nav></header>
<div id="alertbar"></div>
<div id="bkbar"></div>
<div id="synbar"></div>
<div id="hero"></div>
<main id="app"></main>
<footer>Made by mostafa saeed</footer>
<script>
const STANDALONE=true;
const KEY='wt_v1';
const DEF={students:[],sessions:[],att:{},assess:[],events:[],audit:[],skills:[],skillAssess:[],plans:[],skillNotes:{},alertSt:{},classes:[],curClass:null,cur:null,
 set:{hi:80,mid:60,drop:15,low:50,minN:3,bonus:1,pen:-1,absN:2,lowEng:-3,lang:'en',liveCols:'auto',autoXls:true}};
let D,saveOK=true;
try{D=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));D.set=Object.assign({},DEF.set,D.set)}catch(e){D=JSON.parse(JSON.stringify(DEF));saveOK=false}
let FH=null,fhTimer=null;
let SY={st:'local',dev:Math.random().toString(36).slice(2),chunks:null,ts:0,timer:null,busy:false,dirty:false,first:0,col:null,uid:null,conflict:null,unsub:null};
let undoStack=[],lastSnap=null,lastPush=0;
function save(){const j=JSON.stringify(D);if(lastSnap!==null&&j!==lastSnap){if(Date.now()-lastPush>800){undoStack.push(lastSnap);lastPush=Date.now();if(undoStack.length>30)undoStack.shift();let tot=undoStack.reduce((a,x)=>a+x.length,0);while(tot>12e6&&undoStack.length>1)tot-=undoStack.shift().length}}lastSnap=j;try{localStorage.setItem(KEY,j);saveOK=true}catch(e){saveOK=false}
 const s=document.getElementById('save');stTxt();s.style.color=saveOK?'':'#b3261e';try{renderBar()}catch(e){}const u=document.getElementById('undoAll');if(u)u.disabled=!undoStack.length;syncSoon();fhSoon();idbSoon()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AR={Dashboard:'لوحة المعلومات',Students:'الطلاب',Attendance:'الحضور',Quiz:'الكويزات','Live':'المتابعة المباشرة','Practical Skills':'المهارات العملية',Alerts:'التنبيهات',Settings:'الإعدادات'};
const t=k=>D.set.lang==='ar'&&AR[k]||k;
const tabs=['Dashboard','Students','Attendance','Quiz','Live','Practical Skills','Alerts','Settings'];
let tab='Attendance',q='',pid=null,dTier=null;
const today=()=>new Date().toISOString().slice(0,10);
// ---- calculations ----
const act=()=>D.students.filter(s=>s.status==='Active'&&s.cls===D.curClass).sort((a,b)=>stuCmp(a,b));
const live=()=>D.events.filter(e=>!e.reversed);
const sessScore=(sid,stid)=>live().filter(e=>e.sess===sid&&e.stu===stid).reduce((a,e)=>a+e.pts,0);
function results(stid){return D.assess.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(a=>{const v=a.scores[stid];return v==null||v===''?null:{date:a.date,p:100*v/a.max,t:a.title,v,max:a.max}}).filter(Boolean)}
const avg=a=>a.length?a.reduce((s,x)=>s+x.p,0)/a.length:null;
const tier=p=>p>=D.set.hi?['High','hi']:p>=D.set.mid?['Medium','md']:['Low','lo'];
function trend(id){const r=results(id);if(r.length<D.set.minN)return{c:'Insufficient Data',n:r.length};
 const k=Math.min(3,Math.floor(r.length/2)),rec=avg(r.slice(-k)),old=avg(r.slice(-2*k,-k)),d=rec-old;
 return{c:d>=5?'Improving':d<=-5?'Declining':'Stable',d,rec,old,n:r.length}}
function attStats(id){const ss=D.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date));let p=0,ab=0,run=0,tot=0;
 ss.forEach(s=>{const v=(D.att[s.id]||{})[id];if(!v||v==='Excused')return;tot++;if(v==='Absent'){ab++;run++}else{run=0;p++}});
 return{pct:tot?100*p/tot:null,ab,cons:run,tot}}
function skillLatest(id){const o={};D.skillAssess.filter(x=>x.stu===id&&x.n===10).forEach(x=>o[x.skill]=x.lvl);return o}
function alerts(only){const out=[];(only?D.students.filter(s=>s.id===only):act()).forEach(s=>{
 const a=attStats(s.id);if(a.cons>=D.set.absN)out.push({s,key:'abs',sev:'High',k:'neg',m:`${a.cons} consecutive scheduled sessions missed.`,act:'Contact the student about attendance.'});
 const r=results(s.id);
 if(r.length>=2){const last=r[r.length-1],base=avg(r.slice(0,-1).slice(-3));if(base-last.p>=D.set.drop)out.push({s,key:'drop',sev:'High',k:'neg',m:`Sudden drop: baseline ${base.toFixed(0)}% → ${last.p.toFixed(0)}% on "${last.t}" (−${(base-last.p).toFixed(0)} pts, rule ≥${D.set.drop}).`,act:'Review the quiz with the student; consider a development plan.'})}
 if(r.length>=D.set.minN){const m=avg(r);if(m<D.set.low)out.push({s,key:'low',sev:'Medium',k:'',m:`Persistent low performance: average ${m.toFixed(0)}% over ${r.length} quizzes (threshold ${D.set.low}%).`,act:'Offer targeted practice or revision.'})}
 const tr=trend(s.id);
 if(tr.c==='Declining')out.push({s,key:'decl',sev:'Medium',k:'',m:`Declining trend: ${tr.old.toFixed(0)}% → ${tr.rec.toFixed(0)}% (${tr.d.toFixed(1)} pts, ${tr.n} quizzes).`,act:'Monitor and discuss.'});
 if(tr.c==='Improving')out.push({s,key:'impr',sev:'Positive',k:'pos',m:`Improving: ${tr.old.toFixed(0)}% → ${tr.rec.toFixed(0)}% (+${tr.d.toFixed(1)} pts).`,act:'Acknowledge the progress.'});
 const ses=D.sessions.filter(x=>x.status==='Ended'&&x.cls===s.cls).slice(-3);
 if(ses.length>=3){const net=ses.reduce((x,y)=>x+sessScore(y.id,s.id),0)/3;if(net<=D.set.lowEng)out.push({s,key:'eng',sev:'Medium',k:'',m:`Low engagement: average net ${net.toFixed(1)} over the last 3 ended sessions.`,act:'Check in privately. Events reflect instructor observations only.'})}
 });return out.map(a=>{const id=a.s.id+'|'+a.key,r=(D.alertSt||{})[id];return{...a,id,st:r&&r.sig===a.m?r.st:'new'}})}
// ---- charts ----
function line(pts,h=140,mx=100,u='%'){if(!pts.length)return '<span class="mut">No data yet.</span>';const w=320,L=26,B=h-18,n=pts.length,x=i=>L+(n===1?(w-L)/2:i*(w-L-8)/(n-1)),y=v=>8+(B-8)*(1-v/mx);
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${[0,mx/2,mx].map(g=>`<line x1="${L}" x2="${w}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="0" y="${y(g)+3}">${g}</text>`).join('')}
 <polyline fill="none" stroke="var(--olive)" stroke-width="2" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--ink)"><title>${esc(p.l)}: ${p.v.toFixed(0)}${u}</title></circle>`).join('')}</svg>`}
function bars(items,max){if(!items.length)return '<span class="mut">No data yet.</span>';return items.map(i=>`<div class="bar" ${i.c?`onclick="${i.c}"`:''}><span style="width:120px" class="lb">${esc(i.l)}</span><i style="width:${Math.max(2,100*i.v/Math.max(max,1)*.55)}%"></i><b>${i.t??i.v}</b></div>`).join('')}
const DA=(k,l)=>`<button class="btn" onclick="del('${k}','',this)">${l}</button>`;
function donut(it){const tot=it.reduce((a,x)=>a+x.v,0);if(!tot)return '<span class="mut">No graded students yet.</span>';let a0=-Math.PI/2;const R=50,r=30,c=60;
 const arcs=it.map(x=>{if(!x.v)return '';const a1=a0+2*Math.PI*x.v/tot,big=a1-a0>Math.PI?1:0,p=(rr,a)=>(c+rr*Math.cos(a)).toFixed(2)+' '+(c+rr*Math.sin(a)).toFixed(2);let d;
  if(x.v===tot)d=`M${c} ${c-R}A${R} ${R} 0 1 1 ${c-.01} ${c-R}L${c-.01} ${c-r}A${r} ${r} 0 1 0 ${c} ${c-r}Z`;else d=`M${p(R,a0)}A${R} ${R} 0 ${big} 1 ${p(R,a1)}L${p(r,a1)}A${r} ${r} 0 ${big} 0 ${p(r,a0)}Z`;a0=a1;
  return `<path d="${d}" fill="${x.col}" style="cursor:pointer" onclick="${x.c}"><title>${x.l}: ${x.v}</title></path>`}).join('');
 return `<div class="row" style="gap:18px"><svg viewBox="0 0 120 120" width="150" role="img">${arcs}<text x="60" y="65" text-anchor="middle" style="font-size:18px;font-weight:700">${tot}</text></svg><div>${it.map(x=>`<div class="bar" onclick="${x.c}"><i style="width:14px;height:14px;background:${x.col}"></i>${x.l}: <b>${x.v}</b></div>`).join('')}</div></div>`}
function cols(it,lo,hi){if(!it.length)return '<span class="mut">No data yet.</span>';const w=320,h=150,L=4,B=h-22,T=16,n=it.length,bw=Math.min(36,(w-L)/n*.6),y=v=>T+(B-T)*(1-(v-lo)/(hi-lo)),z=y(Math.max(lo,0));
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img"><line x1="0" x2="${w}" y1="${z}" y2="${z}" stroke="var(--line)"/>${it.map((d,i)=>{const cx=L+(i+.5)*(w-L)/n,yy=y(d.v);return `<rect x="${cx-bw/2}" y="${Math.min(yy,z)}" width="${bw}" height="${Math.max(1,Math.abs(z-yy))}" fill="${d.v<0?'var(--bad)':'var(--olive)'}"/><text x="${cx}" y="${Math.min(yy,z)-3}" text-anchor="middle">${d.t??d.v}</text><text x="${cx}" y="${h-8}" text-anchor="middle">${esc(d.l.slice(5))}</text>`}).join('')}</svg>`}
// ---- views ----
const V={};
const nm=s=>`<a class="nm" tabindex="0" onclick="openStu('${s.id}')" onkeydown="if(event.key==='Enter'){event.stopPropagation();openStu('${s.id}')}">${esc(s.name)}</a>`;
V.Dashboard=()=>{const S=act(),rows=S.map(s=>({s,m:avg(results(s.id)),tr:trend(s.id)}));
 const ranked=rows.filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);const tiers={High:[],Medium:[],Low:[]};ranked.forEach(x=>tiers[tier(x.m)[0]].push(x));
 const all=D.assess.filter(a=>a.cls===D.curClass).flatMap(a=>Object.values(a.scores).filter(v=>v!==''&&v!=null).map(v=>100*v/a.max)),ats=S.map(s=>attStats(s.id).pct).filter(x=>x!=null);
 const ss=D.sessions.filter(x=>x.cls===D.curClass).sort((a,b)=>a.date.localeCompare(b.date));
 const qa=D.assess.filter(a=>a.cls===D.curClass).slice().sort((a,b)=>a.date.localeCompare(b.date)).map(a=>{const v=Object.values(a.scores).filter(x=>x!==''&&x!=null);return v.length?{l:a.title,v:v.reduce((x,y)=>x+100*y/a.max,0)/v.length}:null}).filter(Boolean);
 const att=ss.map(s=>{const m=D.att[s.id]||{},p=S.filter(x=>m[x.id]==='Present').length,tt=S.filter(x=>m[x.id]).length;return tt?{l:s.date,v:100*p/tt,t:Math.round(100*p/tt)+'%'}:null}).filter(Boolean);
 const eng=ss.filter(s=>s.status==='Ended').slice(-8).map(s=>{const v=S.reduce((a,x)=>a+sessScore(s.id,x.id),0);return{l:s.date,v,t:v}});
 const li=a=>a.map((x,i)=>`<div class="li"><span class="mono mut">${i+1}</span><span class="n">${nm(x.s)}</span><b>${x.m.toFixed(1)}%</b></div>`).join('')||'<span class="mut">No graded students yet.</span>';
 return `<div class="row"><button class="btn" onclick="clsReport()">Class report</button><span style="display:inline-flex;flex-direction:column;gap:6px;align-items:flex-start"><button class="btn" onclick="exportXlsx()">Export Excel (names, attendance, quiz grades)</button><button class="btn" onclick="exportDash()">Export class dashboard</button></span><span class="lb">Opens as a file — print it or save as PDF</span></div><div class="stats"><div><div class="lb">ACTIVE STUDENTS</div><div class="big">${S.length}</div></div><div><div class="lb">CLASS AVERAGE</div><div class="big">${all.length?(all.reduce((a,b)=>a+b,0)/all.length).toFixed(0)+'%':'—'}</div></div><div><div class="lb">ATTENDANCE</div><div class="big">${ats.length?(ats.reduce((a,b)=>a+b,0)/ats.length).toFixed(0)+'%':'—'}</div></div><div><div class="lb">OPEN ALERTS</div><div class="big">${alerts().filter(a=>a.k!=='pos'&&a.st!=='resolved').length}</div></div></div>
 <div class="ch"><section><h2>Performance levels</h2>${donut([{l:'High',col:'#2c5a47'},{l:'Medium',col:'#b8f200'},{l:'Low',col:'#111111'}].map(x=>({...x,v:tiers[x.l].length,c:`dTier='${x.l}';go()`})))}
 <p class="lb">High ≥ ${D.set.hi}% · Medium ≥ ${D.set.mid}% · Low below. Click a slice for names.</p></section>
 <section><h2>Quiz average over time (%)</h2>${line(qa)}</section>
 <section><h2>Attendance per session (%)</h2>${cols(att.slice(-8),0,100)}</section>
 </div>
 ${dTier?`<section><h2>${dTier.toUpperCase()} LEVEL STUDENTS <a class="nm" onclick="dTier=null;go()">clear</a></h2>${li(tiers[dTier])}</section>`:''}

 ${vis.length?`<div class="row"><span class="lb">Columns with only 0 and 1 are read as attendance; other numbers as quiz grades. Fix any column, or remove it.</span>${P.mode==='all'&&P.items.some(x=>x.kind==='skip')?`<button class="btn" onclick="impP.items=impP.items.filter(x=>x.kind!=='skip');go()">Remove all ignored columns</button>`:''}</div><div class="wrap"><table><tr><th>SHEET</th><th>COLUMN</th><th>WHAT IS IT?</th><th>DETAILS</th><th>VALUES</th><th></th></tr>${vis.map(([it,i])=>`<tr><td>${esc(it.sheet)}</td><td>${esc(it.header)}</td><td><select aria-label="Type" onchange="smSet(${i},'kind',this.value)">${kinds.map(k=>`<option value="${k[0]}" ${it.kind===k[0]?'selected':''}>${k[1]}</option>`).join('')}</select></td><td>${flds(it,i)}</td><td class="lb">${esc(smp(it))}</td><td><button class="btn" onclick="smDel(${i})" aria-label="Remove this column">✕ Remove</button></td></tr>`).join('')}</table></div>`:'<p class="lb">No attendance columns were found, only the names will be imported.</p>'}
 <div class="row"><button class="btn pri" onclick="smCommit()">Import</button><button class="btn" onclick="impP=null;go()">Cancel</button></div></section>`}
function smCommit(){const P=impP;let nS=0,nA=0,nQ=0,sk=0;const have=new Map(D.students.filter(s=>s.cls===D.curClass).map(s=>[normName(s.name),s]));
 let oc=Math.max(0,...D.students.filter(s=>s.cls===D.curClass&&s.ord!=null).map(s=>s.ord));
 P.names.forEach(n=>{const k=normName(n);let st=have.get(k);if(!st){if(!P.addNew)return;st={id:uid(),name:tidy(n),code:'S'+(D.students.length+1),cls:D.curClass,status:'Active'};D.students.push(st);have.set(k,st);nS++}if(st.ord==null)st.ord=++oc});
 P.items.forEach(it=>{if(P.mode!=='all'&&it.kind!=='att')return;if(it.kind==='att'){let ses=it.date?D.sessions.find(x=>x.cls===D.curClass&&x.date===it.date):null;
   if(!ses){ses={id:uid(),date:it.date||today(),topic:it.date?'':it.label,status:'Ended',cls:D.curClass};D.sessions.push(ses)}
   D.att[ses.id]=D.att[ses.id]||{};it.pairs.forEach(([n,v])=>{const st=have.get(normName(n)),m=stat(v,true);if(st&&(m==='Present'||m==='Absent'))D.att[ses.id][st.id]=m});nA++}
  else if(it.kind==='quiz'){const dt=it.date||today();let q=D.assess.find(a=>a.cls===D.curClass&&a.title===it.title&&a.date===dt);
   if(!q){q={id:uid(),title:it.title||'Quiz',date:dt,max:it.max||10,scores:{},cls:D.curClass};D.assess.push(q)}else if(it.max>q.max)q.max=it.max;
   it.pairs.forEach(([n,v])=>{const st=have.get(normName(n)),x=num(v);if(!st||isNaN(x))return;if(x<0||x>q.max){sk++;return}q.scores[st.id]=x});nQ++}});
 impP=null;save();go();alert('Imported: '+nS+' new students, '+nA+' attendance days, '+nQ+' quizzes'+(sk?' ('+sk+' values skipped because they were above the max)':''))}
async function imp(el){const f=el.files[0];if(!f)return;let sheets=[];
 try{if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX){alert('The Excel reader could not load. Check your connection, or save the sheet as CSV.');return}
   const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});sheets=wb.SheetNames.map(n=>({n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})}))}
  else{const t=(await f.text()).replace(/^\ufeff/,''),d=t.includes('\t')?'\t':(t.split(';').length>t.split(',').length?';':',');sheets=[{n:f.name,rows:t.split(/\r?\n/).map(l=>l.split(d).map(x=>x.replace(/^"|"$/g,'').trim()))}]}}
 catch(e){alert('Could not read this file');return}
 const items=[],names=new Map();sheets.forEach(s=>{const a=analyzeSheet(s.n,s.rows);if(!a)return;a.items.forEach(x=>items.push(x));a.names.forEach(n=>{const k=normName(n);if(k&&!names.has(k))names.set(k,n)})});
 if(!names.size){alert('No student names could be found in this file.');return}
 impP={file:f.name,items,names:[...names.values()],addNew:true,mode:'att'};tab='Students';pid=null;go()}
function bak(){D.lastBackup=Date.now();dl('backup-'+today()+'.json',JSON.stringify(D),'application/json');save();go()}
function rest(el){el.files[0].text().then(x=>{try{D=Object.assign({},DEF,JSON.parse(x.replace(/^\ufeff/,'')));fixData();save();go()}catch(e){alert('Invalid backup file')}})}
function demo(){if(!confirm('Add fictional DEMO students?'))return;['One','Two','Three','Four'].forEach(n=>D.students.push({id:uid(),name:'[DEMO] '+n,code:'D'+n,cls:D.curClass,status:'Active',demo:true}));save();go()}
function rmDemo(){const ids=D.students.filter(s=>s.demo).map(s=>s.id);D.students=D.students.filter(s=>!s.demo);D.events=D.events.filter(e=>!ids.includes(e.stu));D.assess.forEach(a=>ids.forEach(i=>delete a.scores[i]));save();go()}
let barSig='',curSig='';
function renderBar(){renderBk();renderSync();const el=document.getElementById('alertbar'),A=tab==='Alerts'?[]:alerts().filter(a=>a.k!=='pos'&&a.st==='new');curSig=A.map(a=>a.s.id+a.m).join('|');
 if(!A.length||curSig===barSig){el.innerHTML='';return}
 el.innerHTML=`<div class="abar" role="alert"><div style="flex:1">${A.slice(0,3).map(a=>`<div><b>${esc(a.s.name)}</b> — ${esc(a.m)}</div>`).join('')}${A.length>3?`<div>+${A.length-3} more</div>`:''}</div><button class="btn" onclick="tab='Alerts';pid=null;go()">View all</button><button class="btn" onclick="barSig=curSig;renderBar()">Dismiss</button></div>`}
function hero(){const c=D.classes.find(x=>x.id===D.curClass),st=pid&&tab==='Students'?D.students.find(x=>x.id===pid):null;
 document.getElementById('hero').className='';document.getElementById('hero').innerHTML=`<div class="hw"><div class="ht">${esc(t(tab))}</div></div><div class="gl"><span>${esc(c?c.name:'')}</span><b>${act().length}</b><span>students</span></div>`}
function syncLabel(){return !saveOK?'⚠ SAVE FAILED — NOT STORED':SY.st==='synced'?'SAVED · SYNCED ☁':SY.st==='syncing'?'SYNCING…':SY.st==='error'?'SAVED ON DEVICE · SYNC ERROR (retrying)':SY.st==='noaccess'?'SAVED ON DEVICE · NO SYNC ACCESS':'SAVED ON THIS DEVICE ONLY'}
function stTxt(){const s=document.getElementById('save');if(s)s.textContent=syncLabel()}
function engCode(){return 'ENG-'+Math.abs([...String(SY.uid)].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7)).toString(36).toUpperCase().padStart(6,'0').slice(0,6)}
let PERSIST=null,idbReady=false,idbT=null,tipHide=false;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('wt_store',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)});d.close()}catch(e){}}
async function idbGet(k){try{const d=await idb();const v=await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});d.close();return v}catch(e){return undefined}}
function idbSoon(){if(!idbReady)return;clearTimeout(idbT);idbT=setTimeout(()=>idbSet(KEY,lastSnap),600)}
async function protectStorage(){try{if(navigator.storage&&navigator.storage.persist){PERSIST=(await navigator.storage.persisted())||(await navigator.storage.persist())}}catch(e){PERSIST=null}
 const had=D.students.length||D.assess.length||D.sessions.length,m=await idbGet(KEY);
 if(!had&&m){try{const x=JSON.parse(m);if(x&&((x.students||[]).length||(x.assess||[]).length)){D=Object.assign({},DEF,x);D.set=Object.assign({},DEF.set,D.set);fixData();idbReady=true;save();go();return}}catch(e){}}
 idbReady=true;idbSoon()}
function iosTip(){if(tipHide||typeof navigator==='undefined')return false;const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const sa=navigator.standalone===true||(typeof matchMedia!=='undefined'&&matchMedia('(display-mode: standalone)').matches);return ios&&!sa}
function syncSoon(){if(!SY.col||SY.conflict||SY.st==='noaccess')return;SY.dirty=true;if(!SY.first)SY.first=Date.now();clearTimeout(SY.timer);SY.timer=setTimeout(push,Date.now()-SY.first>8000?0:1500)}
function syncNow(){if(SY.col&&!SY.conflict){SY.st=SY.st==='noaccess'?'local':SY.st;clearTimeout(SY.timer);push()}}
async function push(){if(!SY.col||SY.busy||SY.conflict)return;SY.busy=true;SY.dirty=false;SY.first=0;SY.st='syncing';stTxt();
 try{const j=JSON.stringify(D),ch=[];for(let i=0;i<j.length;i+=80000)ch.push(j.slice(i,i+80000));
  for(let i=0;i<ch.length;i++){if(!SY.chunks||SY.chunks[i]!==ch[i])await SY.col.doc('p'+i).set({d:ch[i]})}
  const ts=Date.now();await SY.col.doc('meta').set({n:ch.length,ts,by:SY.dev});
  for(let i=ch.length;SY.chunks&&i<SY.chunks.length;i++)await SY.col.doc('p'+i).delete();
  SY.chunks=ch;SY.ts=ts;SY.st='synced';try{localStorage.setItem('wt_sync_'+SY.uid,'1')}catch(e){}}
 catch(e){if(e&&e.code==='invalid_argument'&&!SY.chunks)SY.st='noaccess';else{SY.st='error';SY.dirty=true;clearTimeout(SY.timer);SY.timer=setTimeout(push,8000)}}
 SY.busy=false;if(SY.dirty&&SY.st!=='error')syncSoon();stTxt();renderSync()}
async function pull(meta){const parts=[];for(let i=0;i<meta.n;i++){const d=await SY.col.doc('p'+i).get();if(!d.exists)throw new Error('missing');parts.push(d.data().d)}
 D=Object.assign({},DEF,JSON.parse(parts.join('')));D.set=Object.assign({},DEF.set,D.set);fixData();
 SY.ts=meta.ts;SY.chunks=parts;undoStack=[];lastSnap=JSON.stringify(D);try{localStorage.setItem(KEY,lastSnap);localStorage.setItem('wt_sync_'+SY.uid,'1')}catch(e){}SY.st='synced';stTxt();go()}
function subscribeSync(){if(SY.unsub)return;SY.unsub=SY.col.doc('meta').onSnapshot(s=>{if(!s.exists)return;const m=s.data();if(m.ts>SY.ts&&m.by!==SY.dev&&!SY.dirty&&!SY.busy)pull(m).catch(()=>{})},()=>{})}
async function initSync(){if(STANDALONE)return;try{if(typeof claude==='undefined'||!claude.use){SY.off=true;renderSync();return}const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user){SY.off=true;renderSync();return}const uid=await user.id();if(!uid){SY.off=true;renderSync();return}
 SY.uid=uid;SY.col=db.collection('data/users/'+uid);const m=await SY.col.doc('meta').get();
 if(m.exists){const localHas=D.students.length>0||D.assess.length>0||D.sessions.length>0;let synced=false;try{synced=!!localStorage.getItem('wt_sync_'+uid)}catch(e){}
  if(localHas&&!synced){SY.conflict=m.data();SY.st='local';stTxt();renderSync();return}
  await pull(m.data())}
 else{SY.st='local';await push()}
 subscribeSync();stTxt()}catch(e){SY.st='local';stTxt()}}
async function useCloud(){const m=SY.conflict;SY.conflict=null;try{localStorage.setItem('wt_prev_local',JSON.stringify(D))}catch(e){}try{await pull(m);subscribeSync()}catch(e){SY.st='error'}renderSync()}
async function useLocal(){SY.conflict=null;SY.chunks=null;await push();subscribeSync();renderSync()}
function renderSync(){const el=document.getElementById('synbar');if(!el)return;
 el.innerHTML=SY.conflict?`<div class="abar bk" role="status"><div style="flex:1">Your account already has cloud data. Which one do you want to keep?</div><button class="btn pri" onclick="useCloud()">Use cloud data</button><button class="btn" onclick="useLocal()">Replace cloud with this device</button></div>`:SY.st==='noaccess'?`<div class="abar bk" role="status"><div style="flex:1">Sync is unavailable for your access level, so data stays on this device. Ask the owner to share this page with you as a Contributor.</div></div>`:(!STANDALONE&&SY.off&&!SY.offHide?`<div class="abar bk" role="status"><div style="flex:1">You are not signed in to claude.ai, so your data is saved on this device only. Sign in with your account and reopen this link to use it on your phone and laptop.</div><button class="btn" onclick="SY.offHide=true;renderSync()">OK</button></div>`:(iosTip()?`<div class="abar bk" role="status"><div style="flex:1">On iPhone, Safari can erase a website's data after about a week without opening it. To keep your data safe, add this page to your Home Screen (Share, then Add to Home Screen) and open it from there.</div><button class="btn" onclick="tipHide=true;renderSync()">OK</button></div>`:''))}

function go(keep){document.getElementById('nav').innerHTML=tabs.map(x=>`<button aria-current="${x===tab}" onclick="tab='${x}';q='';pid=null;go()">${t(x)}</button>`).join('');
 const f=document.activeElement,pos=f&&f.selectionStart;document.getElementById('app').innerHTML=V[tab]();document.getElementById('app').setAttribute('data-ok','1');document.documentElement.dir=D.set.lang==='ar'?'rtl':'ltr';document.getElementById('cls').innerHTML=D.classes.map(c=>`<option value="${c.id}" ${c.id===D.curClass?'selected':''}>${esc(c.name)}</option>`).join('')+'<option value="__new">+ Add class</option>';hero();renderBar();
 if(keep&&f&&f.placeholder==='Search'){const i=document.querySelector('input[placeholder="Search"]');if(i){i.focus();i.setSelectionRange(pos,pos)}}}
document.getElementById('lang').onclick=()=>{D.set.lang=D.set.lang==='ar'?'en':'ar';save();go()};
document.addEventListener('keydown',e=>{
 if(e.key==='z'&&(e.ctrlKey||e.metaKey)&&!/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){e.preventDefault();globalUndo();return}
 if(e.key!=='Enter')return;const el=e.target;if(!/^(INPUT|SELECT)$/.test(el.tagName)||el.type==='file'||el.type==='checkbox'||el.dataset.enter)return;
 e.preventDefault();const sc=el.closest('.list')||document.getElementById('app');const f=[...sc.querySelectorAll('input:not([type=file]):not([type=checkbox]):not(:disabled),select')],i=f.indexOf(el),n=f[i+1]||el;if(n===el){el.blur();return}n.focus();if(n.select&&n.type!=='date')n.select()});
D.students.forEach(s=>s.status='Active');
fixData();
document.getElementById('undoAll').onclick=globalUndo;
const cs=document.getElementById('cls'),nc=document.getElementById('newcls');
cs.onchange=function(){if(this.value==='__new'){cs.hidden=true;nc.hidden=false;nc.value='';nc.focus();return}D.curClass=this.value;pid=null;save();go()};
const done=()=>{nc.hidden=true;cs.hidden=false;go()};
nc.onkeydown=e=>{if(e.key==='Escape'){done();return}if(e.key!=='Enter')return;e.preventDefault();const n=nc.value.trim();if(!n){done();return}
 if(D.classes.some(c=>c.name.toLowerCase()===n.toLowerCase())){alert('Class name already exists');return}
 const c={id:uid(),name:n};D.classes.push(c);D.curClass=c.id;pid=null;tab='Students';save();nc.hidden=true;cs.hidden=false;go()};
nc.onblur=()=>{if(!nc.hidden)done()};
save();go();
initSync();
protectStorage();
</script></body></html>
