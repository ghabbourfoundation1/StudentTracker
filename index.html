const RP_WS=6;        // the week starts on Saturday (0=Sunday ... 6=Saturday)
const RP_NAG_FROM=5;  // reminder starts this many days after the week start (5 = Thursday)
const RPQ=[
 {k:'work',req:1,ar:'كتابة تقريرك والمهام التي تم انجازها خلال هذا الاسبوع',en:'Write your report and the tasks you completed this week'},
 {k:'extra',req:0,ar:'تقرير للمهام الاضافية التي تم انجازها خلال الاسبوع',en:'Report on the additional tasks completed during the week'},
 {k:'theory',req:1,ar:'اخر ما تم شرحه نظرياً مع الفصل',en:'The last topic explained theoretically with the class'},
 {k:'prac',req:1,ar:'أخر ما تم شرحه عملياً في الورشة',en:'The last topic explained practically in the workshop'}];
let rpWeek=null,rpCls=null,rpDraft={},rpErr=[],rpDT=null;
const rpIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const rpParse=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const rpStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()-RP_WS+7)%7));return x};
const rpEnd=s=>{const x=rpParse(s);x.setDate(x.getDate()+6);return x};
const rpLoc=()=>D.set.lang==='ar'?'ar-EG':'en-GB';
const rpFmt=d=>d.toLocaleDateString(rpLoc(),{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const rpLabel=s=>rpFmt(rpParse(s))+' – '+rpFmt(rpEnd(s));
const rpCn=id=>{const c=D.classes.find(x=>x.id===id);return c?c.name:''};
const rpTrainer=()=>(VIEW?VIEW.name:(ME.name||ME.email))||'trainer';
const rpFind=(w,c)=>(D.reports||[]).find(r=>r.week===w&&r.cls===c);
function rpCurWeek(){return rpWeek||(rpWeek=rpIso(rpStart(new Date())))}
function rpClsId(){if(!D.classes.find(c=>c.id===rpCls))rpCls=(D.classes.find(c=>c.id===D.curClass)||D.classes[0]||{}).id||null;return rpCls}
function rpVals(){const w=rpCurWeek(),c=rpClsId(),sv=rpFind(w,c)||{},dr=rpDraft[w+'|'+c]||{},o={};RPQ.forEach(q=>{o[q.k]=dr[q.k]!=null?dr[q.k]:(sv[q.k]||'')});return o}
const rpHasDraft=(w,c)=>{const d=rpDraft[w+'|'+c];return !!d&&Object.keys(d).some(k=>String(d[k]).trim())};

// drafts: typed text is kept on this device while writing, so closing the page by mistake loses nothing. A draft is NOT a submitted report.
const rpDKey=()=>'wt_rpd_'+(ME.id||'local');
function rpDLoad(){try{rpDraft=JSON.parse(localStorage.getItem(rpDKey())||'{}')||{}}catch(e){rpDraft={}}}
function rpDFlush(){clearTimeout(rpDT);try{localStorage.setItem(rpDKey(),JSON.stringify(rpDraft));const e=document.getElementById('rpds');if(e)e.textContent=L('Draft saved on this device','تم حفظ مسودة على الجهاز')+' · '+new Date().toLocaleTimeString(rpLoc(),{hour:'2-digit',minute:'2-digit'})}catch(e){}}
function rpDr(k,v){const key=rpCurWeek()+'|'+rpClsId();(rpDraft[key]=rpDraft[key]||{})[k]=v;if(rpErr.includes(k)&&String(v).trim())rpErr=rpErr.filter(x=>x!==k);clearTimeout(rpDT);rpDT=setTimeout(rpDFlush,600)}
window.addEventListener('pagehide',()=>{if(rpDT)rpDFlush()});

function rpPick(v){if(!v)return;rpWeek=rpIso(rpStart(rpParse(v)));rpErr=[];go()}
function rpShift(n){const d=rpParse(rpCurWeek());d.setDate(d.getDate()+7*n);rpWeek=rpIso(d);rpErr=[];go()}
function rpSetCls(id){rpCls=id;rpErr=[];go()}
function rpSave(){
 if(RO)return;const w=rpCurWeek(),c=rpClsId();
 if(!c){toast(L('Add a class first','ضيف فصل الأول'),'err');return}
 const v=rpVals(),miss=RPQ.filter(q=>q.req&&!String(v[q.k]).trim()).map(q=>q.k);
 if(miss.length){rpErr=miss;go();toast(L('Please answer all the required questions (*)','من فضلك جاوب على كل الأسئلة المطلوبة (*)'),'err');return}
 const old=rpFind(w,c),rec={id:old?old.id:uid(),week:w,cls:c,clsName:rpCn(c),ts:Date.now()};
 RPQ.forEach(q=>{rec[q.k]=String(v[q.k]).trim()});
 D.reports=D.reports||[];const i=D.reports.findIndex(r=>r.week===w&&r.cls===c);if(i>=0)D.reports[i]=rec;else D.reports.push(rec);
 delete rpDraft[w+'|'+c];rpDFlush();rpErr=[];save();go();toast(L('Report saved','تم حفظ التقرير'))}

 return `<section style="border-color:#ff9f1c"><h2>${L('WEEKLY REPORT','التقرير الأسبوعي')}</h2>
 <div class="row" style="align-items:center;gap:8px;flex-wrap:wrap"><button class="btn" onclick="rpShift(-1)" aria-label="${L('Previous week','الأسبوع السابق')}">‹</button><input type="date" value="${esc(w)}" onchange="rpPick(this.value)" aria-label="${L('Pick a date in the week','اختار أي تاريخ في الأسبوع')}"><button class="btn" onclick="rpShift(1)" aria-label="${L('Next week','الأسبوع التالي')}">›</button></div>
 <p><b>${L('Week','الأسبوع')}:</b> ${esc(rpLabel(w))}</p>

 ${fields}
 <div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap;align-items:center">${ro?'':`<button class="btn pri" onclick="rpSave()">${rec?L('Update report','تحديث التقرير'):L('Save report','حفظ التقرير')}</button><span id="rpds" class="lb">${rpHasDraft(w,c)?L('You have an unsaved draft on this device','عندك مسودة لم تُحفظ كتقرير على الجهاز'):''}</span>`}</div>
 ${rec?`<p class="lb">${L('Last saved','آخر حفظ')}: ${esc(new Date(rec.ts).toLocaleString(loc))}</p>`:''}
 </section>

async function rpXl(){await loadStyledXlsx();if(!window.XLSX){toast('The Excel library did not load. Check your connection and try again.','err');return false}return true}
function rpTable(title,info,head,body,widths){
 const{ST,cs,C,span,mkws}=xk(),nc=head.length,rows=[],mg=[],hs={};
 const lines=(v,w)=>String(v==null?'':v).split('\n').reduce((a,p)=>a+Math.max(1,Math.ceil(p.length/Math.max(8,w*.95))),0);
 rows.push(span(title,ST.title,nc));mg.push({s:{r:0,c:0},e:{r:0,c:nc-1}});hs[0]={hpt:34};
 info.forEach(p=>{const i=rows.length;rows.push([C(p[0],ST.lab)].concat(span(p[1],ST.val,nc-1)));if(nc>2)mg.push({s:{r:i,c:1},e:{r:i,c:nc-1}});hs[i]={hpt:22}});
 rows.push(head.map(()=>C('',null)));
 const hr=rows.length;rows.push(head.map(h=>C(h,ST.th)));hs[hr]={hpt:30};
 body.forEach(b=>{const i=rows.length;let mx=1;
  rows.push(b.c.map((v,j)=>{const base=(b.lab&&b.lab.includes(j))?ST.lab:(b.cen&&b.cen.includes(j))?ST.cen:ST.val,fill=(b.st&&b.st[j])||b.fill,bold=!!(b.bold&&b.bold.includes(j));
   let sty=fill?cs(base,fill,bold):(bold?cs(base,null,true):base);if(b.red&&b.red.includes(j))sty=Object.assign({},sty,{font:{bold:true,color:{rgb:'9C0006'}}});
   mx=Math.max(mx,lines(v,widths[j]));return C(v,sty)}));
  hs[i]={hpt:Math.min(409,Math.max(30,mx*15+10))}});
 const ws=mkws(rows,widths,mg,hs);ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:hr,c:0},e:{r:rows.length-1,c:nc-1}})};return ws}
const rpWide=[55,55,55,55],rpQHead=()=>RPQ.map(q=>L(q.en,q.ar));
const rpAt=r=>new Date(r.ts).toLocaleString(rpLoc());
const rpMiss=(lead,gap)=>({c:lead.concat([L('Not submitted','لم يُسلَّم')],Array.from({length:gap},()=>'')),fill:'FFC7CE',red:[lead.length],bold:[0,lead.length],cen:[lead.length]});
const rpDone=(lead,r)=>({c:lead.concat(['✓ '+L('Submitted','تم التسليم')],RPQ.map(q=>r[q.k]||''),[rpAt(r)]),st:{[lead.length]:'C6EFCE'},cen:[lead.length],bold:[0]});

 ${haveW?`<p><b>${nAll}</b> ${L('of','من')} <b>${TCH.length}</b> ${L('trainers submitted this week’s report','مدربين سلّموا تقرير الأسبوع')}${nPart?` · <b>${nPart}</b> ${L('partly','جزئي')}`:''}</p>`:TWK.err?`<div class="al neg">${esc(TWK.err)}</div><p class="lb">${L('Weekly status needs the new SQL block: run supabase_update.sql in Supabase.','حالة التسليم الأسبوعية محتاجة كود SQL الجديد: شغّل ملف supabase_update.sql في Supabase.')}</p>`:`<p class="lb">${L('Loading…','جاري التحميل…')}</p>`}
 <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn${trMissing?' pri':''}" aria-pressed="${trMissing}" onclick="trMissing=!trMissing;go()">${L('Show only missing','الناقصين بس')}</button><button class="btn" onclick="trWeekXl(this)">⬇ ${L('Week reports of all trainers (Excel)','تقارير الأسبوع لكل المدربين (Excel)')}</button></div>
 <p class="lb" style="display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center"><span><span class="trc ok" aria-hidden="true">✓</span> ${L('all classes submitted','كل الفصول اتسلّمت')}</span><span><span class="trc part" aria-hidden="true">1/2</span> ${L('some classes','بعض الفصول')}</span><span><span class="trc none" aria-hidden="true"></span> ${L('nothing submitted','لم يسلّم أي تقرير')}</span></p></section>
 <section>${h}${list.length?`<div class="wrap"><table><thead><tr><th>${L('Report','التقرير')}</th><th>${L('Name','الاسم')}</th><th>${L('Email','الإيميل')}</th><th>${L('Classes','الفصول')}</th><th>${L('Students','الطلاب')}</th><th>${L('Sessions','الحصص')}</th><th>${L('Last sync','آخر مزامنة')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><p class="lb">${L('Admin access is read-only. Open a trainer to browse their data, or press Excel to download all of their classes without opening them.','صلاحية الأدمن قراءة فقط. افتح مدرب عشان تتصفح بياناته، أو اضغط Excel لتحميل كل فصوله من غير ما تفتحها.')}</p>`:`<p class="mut">${TCH.length?L('Everyone has submitted this week’s report.','كل المدربين سلّموا تقرير الأسبوع.'):L('No trainers have signed up yet.','لسه مفيش مدربين سجّلوا.')}</p>`}</section>`};

async function trWeekXl(btn){
 if(!SB||ME.role!=='admin')return;if(!await rpXl())return;
 const w=rpCurWeek();if(btn)btn.disabled=true;
 try{
  const r=await SB.rpc('admin_week',{wk:w});if(r.error)throw r.error;
  const list=r.data||[];if(!list.length){toast(L('No trainers yet','لسه مفيش مدربين'),'err');return}
  const body=[];let nAll=0;
  list.forEach(t=>{const cl=t.t_classes||[],rp=t.t_reports||[],name=t.tname||t.temail||'—';
   if(!cl.length){body.push(rpMiss([name,'—'],RPQ.length+1));return}
   let ok=0;cl.forEach(c=>{const x=rp.find(y=>y.cls===c.id);if(x){ok++;body.push(rpDone([name,c.name],x))}else body.push(rpMiss([name,c.name],RPQ.length+1))});
   if(ok===cl.length)nAll++});
  const head=[L('Trainer','المدرب'),L('Class','الفصل'),L('Status','الحالة')].concat(rpQHead(),[L('Submitted at','وقت التسليم')]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,rpTable(L('Weekly reports','التقارير الأسبوعية'),[[L('Week','الأسبوع'),rpLabel(w)],[L('Submitted','سلّموا'),nAll+' / '+list.length+' '+L('trainers','مدربين')]],head,body,[24,16,16].concat(rpWide,[22])),L('Week reports','تقارير الأسبوع'));
  await dl('trainers-reports-'+w+'.xlsx',wbBlob(wb),'')
 }catch(e){toast(L('Could not download: ','تعذّر التحميل: ')+((e&&e.message)||e),'err')}
 finally{if(btn)btn.disabled=false}}

// admin: a trainer's whole workbook (all classes + all weekly reports) without opening the trainer
async function adminExcel(id,btn){
 if(!SB||ME.role!=='admin')return;
 if(!await rpXl())return;
 const T=(TCH||[]).find(x=>x.tid===id),tn=T?(T.tname||T.temail):'trainer';
 if(btn)btn.disabled=true;
 try{
  const r=await SB.from('workspaces').select('data,ts').eq('user_id',id).maybeSingle();if(r.error)throw r.error;
  if(!r.data||!r.data.data){toast(L('This trainer has no data yet','المدرب ده لسه ما سجّلش بيانات'),'err');return}
  const keep=D,wb=XLSX.utils.book_new();let many=false,skipped=0;
  try{
   const d=Object.assign({},JSON.parse(JSON.stringify(DEF)),r.data.data);d.set=Object.assign({},DEF.set,d.set);d.set.lang=keep.set.lang;D=d;fixData();
   const cl=D.classes.slice();many=cl.length>1;
   cl.forEach(c=>{D.curClass=c.id;let w1;try{w1=buildXlsx()}catch(e){skipped++;return}
    w1.SheetNames.forEach(n=>{let nm=(many?c.name.replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,12)+' - '+n:n).slice(0,31),b=nm,k=2;while(wb.SheetNames.includes(nm))nm=b.slice(0,28)+' '+(k++);XLSX.utils.book_append_sheet(wb,w1.Sheets[n],nm)})});
   if((D.reports||[]).length){const order=D.classes.map(c=>c.id),list=D.reports.slice().sort((a,b)=>String(a.week).localeCompare(String(b.week))||order.indexOf(a.cls)-order.indexOf(b.cls));
    XLSX.utils.book_append_sheet(wb,rpTable(L('Weekly reports','التقارير الأسبوعية'),[[L('Trainer','المدرب'),tn]],[L('Week','الأسبوع'),L('Class','الفصل')].concat(rpQHead(),[L('Submitted at','وقت التسليم')]),list.map(x=>({c:[x.week,x.clsName||rpCn(x.cls)].concat(RPQ.map(q=>x[q.k]||''),[rpAt(x)]),bold:[1]})),[14,18].concat(rpWide,[22])),L('Weekly reports','التقارير الأسبوعية'))}
  }finally{D=keep}
  if(!wb.SheetNames.length){toast(L('Nothing to export yet','مفيش حاجة للتصدير لسه'),'err');return}
  await dl('workshop-'+fname(tn)+(many?'-all-classes':'')+'.xlsx',wbBlob(wb),'');
  if(skipped)toast(L('Some empty classes were skipped','اتخطّينا فصول فاضية'))
 }catch(e){toast(L('Could not download: ','تعذّر التحميل: ')+((e&&e.message)||e),'err')}
 finally{if(btn)btn.disabled=false}}
// ---- shell ----
function go(keep){document.getElementById('nav').innerHTML=tabs.map(x=>`<button${x==='Report'?' class="rpt"':''} aria-current="${x===tab}" onclick="tab='${x}';q='';pid=null;go()">${t(x)}</button>`).join('');
 const f=document.activeElement,pos=f&&f.selectionStart;document.getElementById('app').innerHTML=V[tab]();document.getElementById('app').setAttribute('data-ok','1');document.documentElement.dir=D.set.lang==='ar'?'rtl':'ltr';document.getElementById('cls').innerHTML=D.classes.map(c=>`<option value="${c.id}" ${c.id===D.curClass?'selected':''}>${esc(c.name)}</option>`).join('')+(RO?'':'<option value="__new">+ Add class</option>');{const s=document.getElementById('cls');s.hidden=!document.getElementById('newcls').hidden||(RO&&!VIEW)}hero();renderBar();trApply();
 if(keep&&f&&f.placeholder==='Search'){const i=document.querySelector('input[placeholder="Search"]');if(i){i.focus();i.setSelectionRange(pos,pos)}}}
document.getElementById('lang').onclick=()=>{D.set.lang=D.set.lang==='ar'?'en':'ar';save();go()};
document.addEventListener('keydown',e=>{
 if(e.key==='z'&&(e.ctrlKey||e.metaKey)&&!/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){e.preventDefault();globalUndo();return}
 if(e.key!=='Enter')return;const el=e.target;if(!/^(INPUT|SELECT)$/.test(el.tagName)||el.type==='file'||el.type==='checkbox'||el.dataset.enter)return;
 e.preventDefault();const sc=el.closest('.list')||document.getElementById('app');const f=[...sc.querySelectorAll('input:not([type=file]):not([type=checkbox]):not(:disabled),select')],i=f.indexOf(el),n=f[i+1]||el;if(n===el){el.blur();return}n.focus();if(n.select&&n.type!=='date')n.select()});
D.students.forEach(s=>s.status='Active');
fixData();
document.getElementById('undoAll').onclick=globalUndo;
const cs=document.getElementById('cls'),nc=document.getElementById('newcls');
cs.onchange=function(){if(this.value==='__new'){cs.hidden=true;nc.hidden=false;nc.value='';nc.focus();return}D.curClass=this.value;pid=null;save();go()};
const done=()=>{nc.hidden=true;cs.hidden=false;go()};
nc.onkeydown=e=>{if(e.key==='Escape'){done();return}if(e.key!=='Enter')return;e.preventDefault();const n=nc.value.trim();if(!n){done();return}
 if(D.classes.some(c=>c.name.toLowerCase()===n.toLowerCase())){alert('Class name already exists');return}
 const c={id:uid(),name:n};D.classes.push(c);D.curClass=c.id;pid=null;tab='Students';save();nc.hidden=true;cs.hidden=false;go()};
nc.onblur=()=>{if(!nc.hidden)done()};
save();go();
if(STANDALONE){protectStorage();snapDaily();rpDLoad()}
initAuth();
</script></body></html>
